version: 1
bundleID: com.mschiller890.iosobscura

# Merged over the Info.plist xtool generates - see Info.plist for why.
infoPath: Info.plist

# The 1024x1024 master icon. xtool copies it to the bundle root and sets
# the legacy CFBundleIconFile key, which iOS 11+ ignores - CFBundleIcons in
# Info.plist is what actually registers it on the home screen.
iconPath: Resources/AppIcon.png

# The other fourteen sizes `iconPath:` can't carry (it only takes one
# file). Every name here must appear in Info.plist's CFBundleIcons /
# CFBundleIcons~ipad, and every name there must appear here.
resources:
  - Resources/AppIcon-20@1x.png
  - Resources/AppIcon-20@2x.png
  - Resources/AppIcon-20@3x.png
  - Resources/AppIcon-29@1x.png
  - Resources/AppIcon-29@2x.png
  - Resources/AppIcon-29@3x.png
  - Resources/AppIcon-40@1x.png
  - Resources/AppIcon-40@2x.png
  - Resources/AppIcon-40@3x.png
  - Resources/AppIcon-60@2x.png
  - Resources/AppIcon-60@3x.png
  - Resources/AppIcon-76@1x.png
  - Resources/AppIcon-76@2x.png
  - Resources/AppIcon-83.5@2x.png
